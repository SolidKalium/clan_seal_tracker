version: 2
updates:
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    # Only propose releases that have been public for two weeks.
    cooldown:
      default-days: 14
    groups:
      # Minor and patch updates share one PR; majors get their own for review.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is blocked: typescript-eslint requires <6.1 and vue-tsc
      # depends on the TypeScript API (js/MIGRATION_DECISIONS.md). Remove this
      # once both support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
