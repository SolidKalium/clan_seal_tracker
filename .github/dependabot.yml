version: 2
updates:
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    # Only propose releases that have been public for two weeks.
    cooldown:
      default-days: 14
    groups:
      # Minor and patch updates share one PR; majors get their own for review.
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
